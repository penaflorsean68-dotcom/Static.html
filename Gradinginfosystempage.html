```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grading Info System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 30px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 18px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #333;
            color: white;
        }

        button:hover {
            background-color: #555;
        }

        .record {
            border: 1px solid #ccc;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
            background-color: #fafafa;
        }

        .passed {
            color: green;
            font-weight: bold;
        }

        .failed {
            color: red;
            font-weight: bold;
        }

        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>GRADING INFO SYSTEM PAGE</h1>

    <h2>Add Student</h2>

    <form id="studentForm">

        <div class="form-group">
            <label>Username:</label>
            <input type="text" id="username" required>
        </div>

        <div class="form-group">
            <label>Student Name:</label>
            <input type="text" id="name" required>
        </div>

        <div class="form-group">
            <label>Subject:</label>
            <select id="subject" required>
                <option value="">Select Subject</option>
                <option value="Mathematics">Mathematics</option>
                <option value="Science">Science</option>
                <option value="English">English</option>
            </select>
        </div>

        <div class="form-group">
            <label>Course:</label>
            <input type="text" id="course" required>
        </div>

        <div class="form-group">
            <label>School:</label>
            <input type="text" id="school" required>
        </div>

        <div class="form-group">
            <label>Quiz Score (20%):</label>
            <input type="number" id="quiz" min="0" max="100" required>
        </div>

        <div class="form-group">
            <label>Exam Score (50%):</label>
            <input type="number" id="exam" min="0" max="100" required>
        </div>

        <div class="form-group">
            <label>Activities Score (30%):</label>
            <input type="number" id="activities" min="0" max="100" required>
        </div>

        <button type="submit">Add Student</button>

        <p id="errorMessage" class="error"></p>

    </form>

    <h2>Student Records</h2>

    <div id="studentRecords"></di
